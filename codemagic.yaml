workflows:
  android-debug:
    name: Gossip Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - VAR
      node: 22
      java: 21
      vars:
        NODE_OPTIONS: "--max-old-space-size=4096"
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm install --no-frozen-lockfile
      - name: Create .env
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
  android-release:
    name: Gossip Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - VAR
      node: 22
      java: 21
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
        GRADLE_OPTS: "-Xmx8192m -XX:MaxMetaspaceSize=1024m"
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm install --no-frozen-lockfile --shamefully-hoist
      - name: Create .env
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Clean build directories
        script: |
          cd android
          rm -rf app/build app/.cxx .gradle
          echo "✅ Cleaned build directories"
      - name: Generate Codegen
        script: |
          cd android
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --stacktrace
          echo "✅ Codegen complete"
      - name: Build Android Release Split APKs
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon --warning-mode all
          echo "✅ Build complete! Generated APKs:"
          ls -lh app/build/outputs/apk/release/
    artifacts:
      - android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
      - android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - android/app/build/outputs/apk/release/app-x86-release.apk
      - android/app/build/outputs/apk/release/app-x86_64-release.apk
      - android/app/build/outputs/apk/release/*.apk

  ios-simulator:
    name: Gossip iOS Simulator (Debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - VAR
      node: 22
      xcode: latest
      vars:
        NODE_OPTIONS: "--max-old-space-size=4096"
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm install --no-frozen-lockfile
      - name: Create .env
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Expo Prebuild (iOS)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Build iOS Simulator
        script: |
          xcodebuild \
            -workspace ios/Gossip.xcworkspace \
            -scheme Gossip \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.app

  ios-release:
    name: Gossip iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - VAR
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ssabee1722.gossip
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        CERTIFICATE_PRIVATE_KEY: $CERTIFICATE_PRIVATE_KEY
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm install --no-frozen-lockfile
      - name: Create .env
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Expo Prebuild (iOS)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.ssabee1722.gossip \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "com.ssabee1722.gossip" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build iOS Release IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Gossip.xcworkspace \
            --scheme Gossip
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
